name: Pull Request Notifier

on:
  pull_request:
    types:
      - opened
jobs:
  test:
    runs-on: ubuntu-latest  

    strategy:
      matrix: 
        reviewer: ${{ github.event.pull_request.requested_reviewers }}

    steps:
      - name: Comment PR
        run: gh pr comment ${{ github.event.pull_request.number }} --body "@${{ matrix.reviewer.login }} must review this pull request."
        env:
          GH_TOKEN: ${{ github.token }}
